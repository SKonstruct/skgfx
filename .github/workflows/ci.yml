name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request supersedes the older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: desktop/pom.xml

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload agent jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skgfx-agent
          path: desktop/target/skgfx-agent.jar
          if-no-files-found: error

  # The C present pass is only compiled here (it needs a gl4es and a GL ES context to run): this catches syntax errors,
  # missing declarations and new warnings before the Android and iOS apps do.
  mobile-linux:
    name: mobile (gcc and clang, GLES headers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the OpenGL ES headers
        run: sudo apt-get update && sudo apt-get install -y libgles2-mesa-dev

      - name: Compile (gnu11, because clock_gettime and CLOCK_MONOTONIC are POSIX)
        run: |
          for cc in gcc clang; do
            echo "== $cc"
            $cc -std=gnu11 -Wall -Wextra -fsyntax-only -I mobile mobile/skgfx.c
          done

  mobile-ios:
    name: mobile (iOS SDK)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile for device and simulator
        run: |
          for sdk in iphoneos iphonesimulator; do
            echo "== $sdk"
            xcrun --sdk $sdk clang -fsyntax-only -Wall -Wextra -Werror -DGLES_SILENCE_DEPRECATION -I mobile mobile/skgfx.c
          done
